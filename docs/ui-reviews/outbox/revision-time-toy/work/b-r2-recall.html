<!DOCTYPE html>
<meta charset="utf-8">
<title>B r2 — Recall to Formation</title>
<link rel="stylesheet" href="_dial.css">
<style>
  /* ---- the ability, shown: a tether hauling the enemy back to where it started ---- */
  .tether { position:absolute; height:8px; transform-origin:0 50%; border-radius:4px;
    background:repeating-linear-gradient(90deg,
      rgba(255,156,140,.95) 0 22px, rgba(255,156,140,0) 22px 42px);
    filter:drop-shadow(0 0 14px rgba(255,110,90,.9)); }
  .home { position:absolute; transform:translate(-50%,-50%);
    width:186px; height:92px; border-radius:50%;
    border:5px dashed rgba(255,182,168,.95);
    background:radial-gradient(ellipse, rgba(255,140,120,.24), rgba(0,0,0,0) 72%);
    box-shadow:0 0 44px rgba(255,120,95,.55); }
  .homeghost { position:absolute; transform:translate(-50%,-100%);
    width:104px; height:150px; border-radius:52px/64px;
    background:linear-gradient(180deg, rgba(255,178,164,.34), rgba(255,120,100,.06));
    border:3px dashed rgba(255,190,178,.7); }
  .homelab { position:absolute; transform:translate(-50%,0);
    font-size:24px; font-weight:800; letter-spacing:4px; color:#FFC9BE;
    white-space:nowrap; text-shadow:0 2px 8px #000; }

  /* the payoff: it cannot swing, and for how long */
  .disarm { position:absolute; transform:translate(-50%,-50%);
    width:150px; height:150px; border-radius:50%;
    background:conic-gradient(#FF9C8C 0 34%, rgba(255,255,255,.10) 34%);
    border:5px solid rgba(255,208,198,.95); display:grid; place-items:center;
    box-shadow:0 0 50px rgba(255,110,90,.9), inset 0 0 30px rgba(70,10,6,.6); }
  .disarm i { font-style:normal; font-size:62px; color:#FFF1ED; text-shadow:0 3px 6px #000; }
  .dur { position:absolute; transform:translate(-50%,-100%); text-align:center; }
  .dur b { display:block; font-size:100px; font-weight:800; letter-spacing:-4px; color:#FF9C8C;
    line-height:.86; text-shadow:0 0 34px rgba(255,90,70,1), 0 6px 0 rgba(20,4,4,.9); }
  .dur span { display:block; font-size:23px; font-weight:800; letter-spacing:4px;
    color:#FFD3CA; margin-top:8px; text-shadow:0 2px 6px #000; }
</style>
<body>
<div class="vig"></div>
<div class="chrome">

  <!-- eligible, unchosen -->
  <div class="ring enemy" style="left:56.8%; top:40.4%"></div>
  <div class="ring enemy" style="left:61.6%; top:21.8%"></div>

  <!-- where it snaps back to: its own deployment hex, drawn on the hex -->
  <div class="home"      style="left:44.0%; top:19.5%"></div>
  <div class="homeghost" style="left:44.0%; top:22.0%"></div>
  <div class="homelab"   style="left:44.0%; top:12.0%">ITS FORMATION HEX</div>

  <!-- hauled from here, back to there -->
  <div class="tether" style="left:1234px; top:616px; width:359px; transform:rotate(-107.5deg)"></div>
  <div class="ring enemy pick" style="left:48.2%; top:42.8%"></div>

  <div class="disarm" style="left:55.5%; top:52.0%"><i>⚔</i></div>
  <div class="dur"    style="left:55.5%; top:45.5%"><b>1.5s</b><span>CANNOT SWING</span></div>

  <div class="dial">
    <div class="fill"></div>
    <div class="notch"    style="left:113px; top:156px"><b>6s</b></div>
    <div class="notch"    style="left:170px; top:103px"><b>5s</b></div>
    <div class="notch"    style="left:241px; top:70px"><b>4s</b></div>
    <div class="notch on" style="left:319px; top:60px"><b>3s</b></div>
    <div class="notch"    style="left:396px; top:75px"><b>2s</b></div>
    <div class="notch"    style="left:464px; top:113px"><b>1s</b></div>
    <div class="knob"     style="left:319px; top:60px"></div>
    <div class="read">
      <div class="num">3<u>s</u></div>
      <div class="sub">ROLLED BACK</div>
    </div>
  </div>

  <div class="hint">TURN THE HOURSTONE &nbsp;·&nbsp; <b>HOLD ⏎</b> TO SPLIT THE HOUR</div>

</div>
</body>
</html>
